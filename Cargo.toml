[workspace]
resolver = "3"
members = ["crates/*"]
# The desktop app pulls in the whole GPU stack; keep `cargo build` / `cargo test`
# fast by default. Build it explicitly with `cargo run -p apix-desktop`.
default-members = ["crates/apix-core", "crates/apix-http", "crates/apix-cli"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/11R5/Apix"

[workspace.dependencies]
apix-core = { path = "crates/apix-core" }
apix-http = { path = "crates/apix-http" }

anyhow = "1"
bytes = "1"
clap = { version = "4", features = ["derive"] }
gpui-kit = "0.7"
reqwest = { version = "0.12", default-features = false, features = [
    "rustls-tls",
    "http2",
    "charset",
    "gzip",
    "brotli",
    "deflate",
] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "2"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
toml = "0.8"

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
opt-level = 3

# Dependencies are optimized even in debug builds so the UI stays smooth while developing.
[profile.dev.package."*"]
opt-level = 2
