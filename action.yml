# Runs an Apix collection in GitHub Actions:
#
#   - uses: 11R5/Apix@main      # better: a tag or commit
#     with:
#       path: api
#       environment: staging
#     env:
#       APIX_VAR_TOKEN: ${{ secrets.API_TOKEN }}
#
# On pull requests it can send only the requests the pull request touches
# and keep one comment on it up to date with the result:
#
#   permissions: { contents: read, pull-requests: write }
#   steps:
#     - uses: actions/checkout@v4
#       with: { fetch-depth: 0 }
#     - uses: 11R5/Apix@main
#       with: { path: api, changed: "true", diff: "true", comment: "true" }
#
# The first run builds `apix` from this repository at the action's version
# (a few minutes); later runs take it from the cache.
name: Apix run
description: Send an Apix collection's requests, run its tests and write JUnit / HTML reports
author: Ahmet Demir
branding:
  icon: zap
  color: blue

inputs:
  path:
    description: The collection, or a folder or request inside it
    default: "."
  environment:
    description: Environment to use (apix run --env)
    required: false
  data:
    description: A CSV or JSON data file; each row is one iteration
    required: false
  iterations:
    description: How many times to send the requests
    required: false
  delay:
    description: Milliseconds to wait between requests
    required: false
  bail:
    description: Stop at the first request that fails ("true" or "false")
    default: "false"
  env-file:
    description: A dotenv file with variables (NAME=value lines)
    required: false
  junit:
    description: Where to write the JUnit XML report (empty for none)
    default: apix-report.xml
  html:
    description: Where to write the HTML report (empty for none)
    default: apix-report.html
  json:
    description: Where to write the JSON report (empty for none)
    required: false
  markdown:
    description: Where to write the Markdown summary, also shown on the job page (empty for none)
    default: apix-report.md
  changed:
    description: >-
      Send only the requests a change touches. "true": since the pull request's base
      branch (or the commit before a push); or a commit, branch or tag. Check out
      with fetch-depth 0 so the branch point can be found
    default: "false"
  diff:
    description: Add what changed in the requests (apix diff) under the summary when "changed" is on ("true" or "false")
    default: "false"
  comment:
    description: >-
      Post the summary on the pull request, editing the same comment on later runs
      ("true" or "false"); the job needs permissions pull-requests write
    default: "false"
  monitor:
    description: >-
      "true": run the collection's monitors once (apix monitor --once) instead of the
      collection; for a scheduled workflow. A failing monitor fails the step and tells
      its webhook
    default: "false"
  monitor-log:
    description: Where the monitors keep their last results; cache it between runs so a monitor that passes again is noticed
    default: .apix-monitors
  args:
    description: More arguments for apix run (or apix monitor), e.g. "--timeout 10 --var region=eu"
    required: false

runs:
  using: composite
  steps:
    # The cache key is a hash of the sources, so `@main` (or `./`) rebuilds
    # when Apix changes and reuses the build when it does not.
    - name: Fingerprint the sources
      id: source
      shell: bash
      run: |
        cd "$GITHUB_ACTION_PATH"
        hash=$(find Cargo.toml Cargo.lock crates vendor -type f \( -name '*.rs' -o -name '*.toml' -o -name '*.js' -o -name 'Cargo.lock' \) \
          -not -path 'crates/apix-desktop/*' | LC_ALL=C sort | xargs cat | sha256sum | cut -c1-16)
        echo "hash=$hash" >> "$GITHUB_OUTPUT"

    - name: Restore apix
      id: cache
      uses: actions/cache@v4
      with:
        path: |
          ~/.cargo/bin/apix
          ~/.cargo/bin/apix.exe
        key: apix-${{ runner.os }}-${{ steps.source.outputs.hash }}

    - name: Build apix
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: cargo install --locked --path "$GITHUB_ACTION_PATH/crates/apix-cli"

    - name: Run the collection
      shell: bash
      # Inputs go through the environment, never into the script text.
      env:
        IN_PATH: ${{ inputs.path }}
        IN_ENVIRONMENT: ${{ inputs.environment }}
        IN_DATA: ${{ inputs.data }}
        IN_ITERATIONS: ${{ inputs.iterations }}
        IN_DELAY: ${{ inputs.delay }}
        IN_BAIL: ${{ inputs.bail }}
        IN_ENV_FILE: ${{ inputs.env-file }}
        IN_JUNIT: ${{ inputs.junit }}
        IN_HTML: ${{ inputs.html }}
        IN_JSON: ${{ inputs.json }}
        IN_MARKDOWN: ${{ inputs.markdown }}
        IN_CHANGED: ${{ inputs.changed }}
        IN_DIFF: ${{ inputs.diff }}
        IN_ARGS: ${{ inputs.args }}
        IN_MONITOR: ${{ inputs.monitor }}
        IN_MONITOR_LOG: ${{ inputs.monitor-log }}
        PUSH_BEFORE: ${{ github.event.before }}
      run: |
        # Extra arguments are split on spaces, like on a command line.
        read -r -a extra <<< "$IN_ARGS"
        if [ "$IN_MONITOR" = "true" ]; then
          margs=(monitor "$IN_PATH" --once --log-dir "$IN_MONITOR_LOG")
          [ -n "$IN_ENV_FILE" ] && margs+=(--env-file "$IN_ENV_FILE")
          exec apix "${margs[@]}" "${extra[@]}"
        fi
        args=(run "$IN_PATH")
        [ -n "$IN_ENVIRONMENT" ] && args+=(--env "$IN_ENVIRONMENT")
        [ -n "$IN_DATA" ] && args+=(--data "$IN_DATA")
        [ -n "$IN_ITERATIONS" ] && args+=(--iterations "$IN_ITERATIONS")
        [ -n "$IN_DELAY" ] && args+=(--delay "$IN_DELAY")
        [ "$IN_BAIL" = "true" ] && args+=(--bail)
        [ -n "$IN_ENV_FILE" ] && args+=(--env-file "$IN_ENV_FILE")
        [ -n "$IN_JUNIT" ] && args+=(--junit "$IN_JUNIT")
        [ -n "$IN_HTML" ] && args+=(--html "$IN_HTML")
        [ -n "$IN_JSON" ] && args+=(--json "$IN_JSON")
        [ -n "$IN_MARKDOWN" ] && args+=(--markdown "$IN_MARKDOWN")

        # What "changed" compares with: the pull request's base branch, the
        # commit before a push, or the commit, branch or tag given.
        base=""
        case "$IN_CHANGED" in
          ""|false) ;;
          true)
            if [ -n "$GITHUB_BASE_REF" ]; then
              base="origin/$GITHUB_BASE_REF"
              git rev-parse --verify -q "$base^{commit}" > /dev/null ||
                git fetch --no-tags -q origin "+refs/heads/$GITHUB_BASE_REF:refs/remotes/origin/$GITHUB_BASE_REF"
            elif [ -n "$PUSH_BEFORE" ] && [ "${PUSH_BEFORE//0/}" != "" ]; then
              base="$PUSH_BEFORE"
              git cat-file -e "$base^{commit}" 2> /dev/null ||
                git fetch --no-tags -q origin "$base" || true
            else
              echo "Nothing to compare with (a new branch?): running every request."
            fi
            ;;
          *) base="$IN_CHANGED" ;;
        esac
        [ -n "$base" ] && args+=("--changed=$base")

        set +e
        apix "${args[@]}" "${extra[@]}"
        code=$?
        set -e
        # What changed in the requests, under the run's summary.
        if [ "$IN_DIFF" = "true" ] && [ -n "$base" ] && [ -n "$IN_MARKDOWN" ] && [ -f "$IN_MARKDOWN" ]; then
          { echo; apix diff "$base" -C "$IN_PATH" --markdown; } >> "$IN_MARKDOWN" || true
        fi
        exit $code

    - name: Add the summary to the job page
      if: always() && inputs.markdown != ''
      shell: bash
      env:
        IN_MARKDOWN: ${{ inputs.markdown }}
      run: |
        if [ -s "$IN_MARKDOWN" ]; then cat "$IN_MARKDOWN" >> "$GITHUB_STEP_SUMMARY"; fi

    # One comment per collection, edited on every run rather than piling up.
    - name: Comment on the pull request
      if: always() && inputs.comment == 'true' && inputs.markdown != '' && github.event.pull_request.number
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        PR: ${{ github.event.pull_request.number }}
        IN_MARKDOWN: ${{ inputs.markdown }}
      run: |
        if [ ! -s "$IN_MARKDOWN" ]; then echo "No summary at $IN_MARKDOWN"; exit 0; fi
        marker=$(head -n 1 "$IN_MARKDOWN")
        id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" \
          --jq '.[] | [.id, (.body | split("\n")[0])] | @tsv' |
          awk -F '\t' -v m="$marker" '$2 == m { id = $1 } END { print id }')
        if [ -n "$id" ]; then
          gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F "body=@$IN_MARKDOWN" > /dev/null
          echo "Updated the comment on pull request #$PR"
        else
          gh api -X POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F "body=@$IN_MARKDOWN" > /dev/null
          echo "Commented on pull request #$PR"
        fi
