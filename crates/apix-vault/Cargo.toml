[package]
name = "apix-vault"
description = "Password-encrypted Apix collections: XChaCha20-Poly1305 per file, Argon2id keys, opaque names"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
argon2 = "0.5"
base64 = "0.22"
chacha20poly1305 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
serde.workspace = true
thiserror.workspace = true
toml.workspace = true
zeroize = { version = "1", features = ["derive"] }

# Remembering a vault's password in the OS credential store (keychain.rs).
[target.'cfg(windows)'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
keyring = { version = "3", features = ["apple-native"] }

[target.'cfg(all(unix, not(target_os = "macos")))'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust", "vendored"] }
