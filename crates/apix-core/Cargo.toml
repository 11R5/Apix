[package]
name = "apix-core"
description = "Request model, variables and the git-friendly file format behind Apix"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
apix-vault.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
toml.workspace = true
# Request signing (AWS SigV4, OAuth 1.0, Digest, PKCE). Already built for other crates, except sha1.
base64 = "0.22"
hmac = "0.12"
md-5 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
sha1 = "0.10"
sha2 = "0.10"
url = "2"
