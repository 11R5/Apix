[package]
name = "apix-desktop"
description = "The Apix desktop app, rendered on the GPU with GPUI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "apix-desktop"
path = "src/main.rs"

[dependencies]
apix-core.workspace = true
apix-http.workspace = true
# `tree-sitter` turns on syntax highlighting in the code editor (JSON is included).
gpui-kit = { workspace = true, features = ["tree-sitter"] }
tokio.workspace = true
