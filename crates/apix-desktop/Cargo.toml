[package]
name = "apix-desktop"
description = "The Apix desktop app, rendered on the GPU with GPUI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "apix-desktop"
path = "src/main.rs"

[dependencies]
apix-codegen.workspace = true
apix-core.workspace = true
apix-http.workspace = true
apix-import.workspace = true
apix-runner.workspace = true
apix-script.workspace = true
# The OS config folder for recent collections and chosen environments.
dirs = "6"
# Completion and hover items for the GraphQL query editor; the version gpui-kit uses.
lsp-types = "0.97.0"
# `tree-sitter` turns on syntax highlighting in the code editor (JSON is included).
# HTML colours both HTML and XML bodies and responses.
gpui-kit = { workspace = true, features = ["tree-sitter", "tree-sitter-html", "tree-sitter-javascript"] }
# Interface texts in locales/<code>.yml; the same version gpui-kit uses, so both share one locale.
rust-i18n = "4"
# Same version gpui-component already builds, so it is not compiled twice.
notify = "8.2.0"
serde.workspace = true
serde_json.workspace = true
# The system language, for the first start (already built by gpui).
sys-locale = "0.3"
tokio = { workspace = true, features = ["sync"] }
toml.workspace = true
# Deleting from the sidebar moves files to the OS trash instead of removing them.
trash = "5"
# GraphQL highlighting in the body editor; gpui-component has no highlight query for it.
tree-sitter-graphql = "0.1.0"

[build-dependencies]
# Embeds the app icon and version info into the Windows exe.
embed-resource = "3"

[dev-dependencies]
# Checks that the GraphQL highlight query compiles; same version gpui-component uses.
tree-sitter = "0.26"
