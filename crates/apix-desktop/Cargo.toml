[package]
name = "apix-desktop"
description = "The Apix desktop app, rendered on the GPU with GPUI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "apix-desktop"
path = "src/main.rs"

[dependencies]
apix-core.workspace = true
apix-http.workspace = true
apix-import.workspace = true
# Same version gpui-component already builds, so it is not compiled twice.
notify = "8.2.0"
# Deleting from the sidebar moves files to the OS trash instead of removing them.
trash = "5"
# `tree-sitter` turns on syntax highlighting in the code editor (JSON is included).
gpui-kit = { workspace = true, features = ["tree-sitter"] }
tokio.workspace = true
