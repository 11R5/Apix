[package]
name = "apix-import"
description = "Import Postman collections and environments into Apix collections"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
apix-core.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
# OpenAPI and Swagger specs are often YAML.
serde_yaml = "0.9"
# URLs in HAR files are taken apart into base, path and query.
url = "2"
# Postman's "Export data" arrives as a zip of collection and environment files.
zip = { version = "2", default-features = false, features = ["deflate"] }
