[package]
name = "apix-http"
description = "The HTTP engine that sends Apix requests"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
apix-core.workspace = true
bytes.workspace = true
reqwest = { workspace = true, features = ["rustls-tls", "multipart"] }
# A cookie jar the cookie manager can list and edit (reqwest's own `Jar`
# cannot be enumerated), shared by every per-send client.
reqwest_cookie_store = "0.8"
cookie_store = { version = "0.21", features = ["serde_json"] }
# The connection details reqwest keeps in a response (local and remote address).
hyper-util = { version = "0.1", features = ["client-legacy"] }
# Local interfaces, default gateway and DNS servers for the network inspector.
netdev = "0"
# Reads OAuth 2.0 token responses.
serde_json.workspace = true
# `net`, `io-util` and `time` for the OAuth 2.0 login redirect on a loopback port.
tokio = { workspace = true, features = ["net", "io-util", "time", "sync", "macros"] }
# Times connection setup inside reqwest.
tower-layer = "0.3"
tower-service = "0.3"
# Reads the server certificate.
x509-parser = "0"
# WebSocket connections (`ws.rs`), over the same rustls as reqwest.
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
# Socket.IO binary attachments as `{"$binary": "<base64>"}` (socketio.rs).
base64 = "0.22"
# Splits a WebSocket into its sending and receiving halves.
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
thiserror.workspace = true
# TLS for WebSocket (and gRPC without verification): a trusted CA, a client
# certificate or no verification (tls.rs). The rustls and roots reqwest builds.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
webpki-roots = "1"

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "io-util", "sync", "macros", "time"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
tokio-tungstenite = "0.28"
# A local HTTPS server with a certificate from an authority of its own (tests/tls.rs).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
