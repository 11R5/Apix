[package]
name = "apix-http"
description = "The HTTP engine that sends Apix requests"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
apix-core.workspace = true
bytes.workspace = true
reqwest = { workspace = true, features = ["rustls-tls", "multipart"] }
# The connection details reqwest keeps in a response (local and remote address).
hyper-util = { version = "0.1", features = ["client-legacy"] }
# Local interfaces, default gateway and DNS servers for the network inspector.
netdev = "0"
# Reads OAuth 2.0 token responses.
serde_json.workspace = true
# `net`, `io-util` and `time` for the OAuth 2.0 login redirect on a loopback port.
tokio = { workspace = true, features = ["net", "io-util", "time"] }
# Times connection setup inside reqwest.
tower-layer = "0.3"
tower-service = "0.3"
# Reads the server certificate.
x509-parser = "0"
thiserror.workspace = true

[dev-dependencies]
serde_json.workspace = true
tokio = { workspace = true, features = ["net", "io-util"] }
