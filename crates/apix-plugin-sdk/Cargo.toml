[package]
name = "apix-plugin-sdk"
description = "Write Apix plugins in Rust: auth types, importers and visualizers compiled to WebAssembly"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde_json.workspace = true

[dev-dependencies]
# For the example plugins.
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"

[[example]]
name = "hmac_signature"
crate-type = ["cdylib"]

[[example]]
name = "csv_endpoints"
crate-type = ["cdylib"]

[[example]]
name = "json_stats"
crate-type = ["cdylib"]
