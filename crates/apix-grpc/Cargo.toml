[package]
name = "apix-grpc"
description = "gRPC calls for Apix: services described by .proto files or server reflection, messages as JSON"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
apix-core.workspace = true
# OAuth 2.0 tokens for the call's metadata.
apix-http.workspace = true
base64 = "0.22"
# The channel (HTTP/2 over the hyper and rustls reqwest already brings) and the client.
tonic = { version = "0.14", default-features = false, features = ["transport", "tls-ring", "tls-webpki-roots", "codegen"] }
# Only the generated reflection client; the server half stays off.
tonic-reflection = { version = "0.14", default-features = false }
prost = "0.14"
prost-types = "0.14"
# Messages known only at run time, to and from JSON.
prost-reflect = { version = "0.16", features = ["serde"] }
# Reads .proto files in Rust; no protoc needed.
protox = "0.10"
regex = "1"
serde.workspace = true
serde_json.workspace = true
tokio = { workspace = true, features = ["time", "net"] }
tokio-stream = "0.1"
thiserror.workspace = true
# TLS without verification (insecure.rs): the same rustls, ring and
# tokio-rustls that reqwest and tonic already build.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }
hyper-util = { version = "0.1", features = ["tokio"] }
tower-service = "0.3"

[dev-dependencies]
# A test server built from the same dynamic messages, with reflection.
tonic = { version = "0.14", default-features = false, features = ["transport", "router", "server", "codegen", "tls-ring"] }
tonic-reflection = { version = "0.14", features = ["server"] }
tokio = { workspace = true, features = ["net", "macros", "rt-multi-thread", "time", "sync"] }
tokio-stream = { version = "0.1", features = ["net"] }
# A certificate authority and a server certificate for the TLS tests.
rcgen = { version = "0.14", default-features = false, features = ["crypto", "pem", "ring"] }
serde_json.workspace = true
toml.workspace = true
