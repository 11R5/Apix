[package]
name = "apix-plugins"
description = "WebAssembly plugins for Apix: auth types, importers and visualizers, run sandboxed"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
serde = { workspace = true }
serde_json.workspace = true
# The WebAssembly interpreter: pure Rust, small, with fuel to stop runaway plugins.
wasmi = "2"
# Where plugins are kept: <config>/Apix/plugins.
dirs = "6"

[dev-dependencies]
# The example signature, computed again in the tests.
hmac = "0.12"
sha2 = "0.10"
base64 = "0.22"
