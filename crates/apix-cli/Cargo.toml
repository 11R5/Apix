[package]
name = "apix-cli"
description = "Run Apix requests and collections from the terminal and CI"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "apix"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
apix-codegen.workspace = true
apix-core.workspace = true
apix-grpc.workspace = true
apix-http.workspace = true
apix-import.workspace = true
apix-runner.workspace = true
apix-script.workspace = true
clap.workspace = true
rpassword = "7"
# Puts each streamed gRPC message on one line.
serde_json.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
