# Runs an Apix collection on every push and pull request, once per
# environment, shows the test results on the run's page and keeps the HTML
# reports.
#
# Copy this file to .github/workflows/api-tests.yml in your repository and
# change `api` (the collection folder) and the environments.

name: API tests

on:
  push:
  pull_request:

jobs:
  apix:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write # for the test report
    strategy:
      fail-fast: false
      matrix:
        environment: [test, staging]
    steps:
      - uses: actions/checkout@v4

      # Builds `apix` the first time, then takes it from the cache.
      # Pin a tag or commit instead of main for repeatable runs.
      - uses: 11R5/Apix@main
        with:
          path: api
          environment: ${{ matrix.environment }}
          data: api/data/users.csv
          junit: reports/${{ matrix.environment }}.xml
          html: reports/${{ matrix.environment }}.html
        env:
          # Secrets stay out of the repository (.local.toml files are
          # gitignored). APIX_VAR_<NAME> fills {{name}}: APIX_VAR_TOKEN is
          # {{token}}. Another way: write them to a file and pass env-file.
          APIX_VAR_TOKEN: ${{ secrets.API_TOKEN }}
          # Only for an encrypted collection.
          APIX_PASSWORD: ${{ secrets.APIX_PASSWORD }}

      # The reports are written even when tests fail.
      - if: ${{ !cancelled() }}
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: reports/${{ matrix.environment }}.xml
          check_name: API tests (${{ matrix.environment }})
      - if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: apix-report-${{ matrix.environment }}
          path: reports/

# Without the action, in any CI that runs containers:
#
#   docker run --rm -v "$PWD:/work" -e APIX_VAR_TOKEN ghcr.io/11r5/apix \
#     run api --env staging --junit reports/apix.xml
