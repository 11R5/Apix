# Runs an Apix collection in GitLab CI and shows the JUnit results in merge
# requests. Copy it to .gitlab-ci.yml and change `api` and `staging`.
#
# Set API_TOKEN as a masked CI/CD variable; APIX_VAR_TOKEN fills {{token}}.

api-tests:
  # The image holds just the `apix` command (published with Apix releases).
  image:
    name: ghcr.io/11r5/apix:latest
    entrypoint: [""]
  variables:
    APIX_VAR_TOKEN: $API_TOKEN
  script:
    - apix run api --env staging --junit reports/apix.xml --html reports/apix.html
  artifacts:
    when: always
    paths:
      - reports/
    reports:
      junit: reports/apix.xml

