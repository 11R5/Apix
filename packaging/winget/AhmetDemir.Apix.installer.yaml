# winget installer manifest; scripts/channel-manifests.sh fills in @VERSION@
# and @SHA256@. The three AhmetDemir.Apix.*.yaml files go to
# microsoft/winget-pkgs as manifests/a/AhmetDemir/Apix/<version>/.
# yaml-language-server: $schema=https://aka.ms/winget-manifest.installer.1.6.0.schema.json
PackageIdentifier: AhmetDemir.Apix
PackageVersion: "@VERSION@"
InstallerType: inno
InstallModes:
  - interactive
  - silent
  - silentWithProgress
UpgradeBehavior: install
FileExtensions:
  - apix
Commands:
  - apix
Installers:
  - Architecture: x64
    Scope: user
    InstallerUrl: https://github.com/11R5/Apix/releases/download/v@VERSION@/Apix-@VERSION@-windows-x64-setup.exe
    InstallerSha256: "@SHA256@"
    InstallerSwitches:
      Custom: /CURRENTUSER
  - Architecture: x64
    Scope: machine
    InstallerUrl: https://github.com/11R5/Apix/releases/download/v@VERSION@/Apix-@VERSION@-windows-x64-setup.exe
    InstallerSha256: "@SHA256@"
    InstallerSwitches:
      Custom: /ALLUSERS
ManifestType: installer
ManifestVersion: 1.6.0
